<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayur Makwana | Data Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-left: #f3f4f6;
        --bg-right: #0f172a;
        --text-dark: #111827;
        --text-gray: #4b5563;
        --accent: #2563eb; /* A nice professional blue */
        --white: #ffffff;
        --transition: all 0.3s ease;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden; /* Prevent horizontal scroll */
    }

    /* ===== LAYOUT ===== */
    .wrapper {
        display: flex;
        min-height: 100vh;
        width: 100%;
    }

    /* ===== LEFT SIDE ===== */
    .left-section {
        width: 55%;
        background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        clip-path: polygon(0 0, 90% 0, 75% 100%, 0 100%);
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 2; /* Ensures it sits above if needed */
    }

    .brand {
        position: absolute;
        top: 40px;
        left: 80px;
        font-weight: 800;
        font-size: 24px;
        color: var(--text-dark);
        letter-spacing: -1px;
    }

    .content-box {
        max-width: 600px;
        animation: fadeUp 1s ease-out;
    }

    .subtitle {
        font-size: 20px;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 8px;
        display: inline-block;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    h1 {
        font-size: 64px;
        line-height: 1.1;
        margin-bottom: 16px;
        color: var(--text-dark);
        font-weight: 800;
    }

    .description {
        font-size: 18px;
        color: var(--text-gray);
        line-height: 1.6;
        max-width: 90%;
    }

    /* ===== MAIN CTAs (View Projects, Download Resume) ===== */
    .cta-group {
        display: flex;
        gap: 20px;
        margin-top: 30px;
    }

    .primary-cta, .secondary-cta {
        display: inline-flex;
        align-items: center;
        padding: 14px 30px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        transition: var(--transition);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-size: 15px;
    }

    .primary-cta {
        background: var(--accent);
        color: var(--white);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    .primary-cta:hover {
        background: #1d4ed8; /* Darker accent */
        transform: translateY(-3px);
    }

    .secondary-cta {
        background: transparent;
        border: 2px solid var(--text-dark);
        color: var(--text-dark);
        box-shadow: none;
    }

    .secondary-cta:hover {
        background: var(--text-dark);
        color: var(--white);
        transform: translateY(-3px);
    }


    /* ===== SOCIAL ICONS ===== */
    .socials {
        display: flex;
        gap: 20px;
        margin-top: 40px;
    }

    .social-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(0,0,0,0.05);
        transition: var(--transition);
    }

    .social-icon svg {
        width: 20px;
        height: 20px;
        fill: var(--text-dark);
        transition: var(--transition);
    }

    .social-icon:hover {
        background: var(--text-dark);
        transform: translateY(-3px);
    }

    .social-icon:hover svg {
        fill: var(--white);
    }

    /* ===== RIGHT SIDE ===== */
    .right-section {
        width: 45%;
        background: var(--bg-right);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Pattern overlay for texture */
        background-image: radial-gradient(var(--text-gray) 1px, transparent 1px);
        background-size: 40px 40px; 
    }

    /* ===== NAVIGATION ===== */
    .nav {
        position: absolute;
        top: 40px;
        right: 60px;
        display: flex;
        gap: 15px;
        align-items: center;
        z-index: 10;
    }

    .nav a {
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        font-weight: 500;
        font-size: 16px;
        transition: var(--transition);
        padding: 10px 20px;
        border-radius: 50px;
        /* Default state: transparent */
        background: transparent; 
        border: none;
        box-shadow: none;
    }

    /* Hover effect for ALL links: Gives them a background and switches text color to dark */
    .nav a:hover {
        background: var(--white);
        color: var(--text-dark); /* FIX: This ensures dark text on white background */
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* The previously conflicting CSS block for .contact-btn has been removed for a cleaner fix. */

    /* ===== IMAGE PLACEHOLDER ===== */
    .profile-container {
        width: 100%;
        max-width: 450px;
        height: auto;
        aspect-ratio: 4/5;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        margin-right: 15%; /* Pull it slightly left to bridge the gap */
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        animation: fadeLeft 1s ease-out 0.3s backwards;
    }

    .profile-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Default state: Black and White */
        filter: grayscale(100%); 
        /* Updated transition to include filter and transform */
        transition: transform 0.5s ease, filter 0.5s ease;
    }

    .profile-container:hover img {
        transform: scale(1.05);
        /* Hover state: Color */
        filter: grayscale(0);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeLeft {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width: 1024px) {
        .left-section {
            padding: 50px;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }
        h1 { font-size: 48px; }
        .profile-container { margin-right: 50px; }
    }

    @media(max-width: 900px) {
        .wrapper {
            flex-direction: column;
            height: auto;
        }

        .left-section, .right-section {
            width: 100%;
            height: auto;
            clip-path: none;
        }

        .left-section {
            padding: 60px 30px;
            text-align: center;
        }

        .brand {
            position: static;
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }

        .content-box { margin: 0 auto; }
        
        .socials { justify-content: center; }
        
        .cta-group {
            justify-content: center;
            flex-direction: column; /* Stack buttons vertically on small screens */
            gap: 15px;
        }

        .primary-cta, .secondary-cta {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            justify-content: center;
        }


        .right-section {
            padding: 100px 20px 60px 20px; /* Top padding for Nav */
            min-height: 500px;
        }

        .nav {
            top: 30px;
            right: 0;
            width: 100%;
            justify-content: center;
            gap: 20px;
        }

        .nav a { font-size: 14px; }
        
        .profile-container {
            margin: 0;
            max-width: 350px;
        }
    }
</style>
</head>
