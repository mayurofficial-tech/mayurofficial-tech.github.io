<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mayur Makwana</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #f3f4f6;
    --text-dark: #111827;
    --text-gray: #4b5563;
    --accent: #2563eb; 
    --white: #ffffff;
    --linkedin-blue: #0077B5;
    --transition: all 0.3s ease;
}

* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
}

.page-header {
    display: inline-block;
    border: 2px solid var(--text-dark);
    padding: 10px 30px;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 16px;
    border-radius: 50px;
    margin-bottom: 50px;
    text-transform: uppercase;
}

.contact-card {
    background: var(--white);
    border-radius: 12px;
    padding: 40px 30px;
    margin-bottom: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.contact-card h2 {
    font-size: 24px;
    margin-bottom: 25px;
    font-weight: 800;
}

.contact-item {
    margin-bottom: 25px;
}

.contact-item h3 {
    font-size: 15px;
    color: var(--text-gray);
    margin-bottom: 8px;
    text-transform: uppercase;
}

.contact-item a,
.contact-item p {
    font-size: 18px;
    color: var(--text-dark);
    font-weight: 700;
    text-decoration: none;
}

.contact-item a:hover {
    color: var(--accent);
}

/* Buttons */
.send-email-btn,
.social-link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 25px;
    color: var(--white);
    text-decoration: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 15px;
    margin-top: 15px;
    transition: var(--transition);
}

.send-email-btn {
    background: var(--accent);
}

.send-email-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

.social-link-btn {
    background: var(--text-dark);
}

.social-link-btn:hover {
    background: var(--linkedin-blue);
    transform: translateY(-2px);
}

.back-home {
    margin-top: 40px;
    color: var(--text-gray);
    text-decoration: none;
    font-weight: 600;
}

.back-home:hover {
    color: var(--accent);
}

@media (max-width:600px){
    .send-email-btn,
    .social-link-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="page-header">CONTACT ME</div>

<div class="contact-card">

<h2>I'm excited to hear from you!</h2>

<div class="contact-item">

<a href="mailto:makwana.mayur.official@gmail.com">
makwana.mayur.official@gmail.com
</a>
</div>

<div class="contact-item">
<h3>Mobile Number</h3>
<p>+91 8200662776</p>
</div>

<!-- Smart Email Button -->
<a href="mailto:makwana.mayur.official@gmail.com?subject=Inquiry%20from%20Website&body=Hello%20Mayur,%0A%0AI%20am%20writing%20to%20you%20regarding%20[reason].%0A%0ASincerely,%0A[Your%20Name]"
onclick="if(!/Mobi|Android|iPhone/i.test(navigator.userAgent)){
window.open('https://mail.google.com/mail/?view=cm&fs=1&to=makwana.mayur.official@gmail.com','_blank');
return false;}"
class="send-email-btn">
Send Email Now
</a>

<!-- LinkedIn -->
<br>
<a href="https://www.linkedin.com/in/mayur-makwana-8761862a8" target="_blank" class="social-link-btn">
Connect on LinkedIn
</a>

</div>

<a href="index.html" class="back-home">← Back to Home</a>

</div>

</body>
</html>
