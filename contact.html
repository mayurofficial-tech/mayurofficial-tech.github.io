<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mayur Makwana</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-main: #f3f4f6;
        --text-dark: #111827;
        --text-gray: #4b5563;
        --accent: #2563eb; 
        --white: #ffffff;
        --linkedin-blue: #0077B5;
        --transition: all 0.3s ease;
        --warning-red: #dc2626; /* Original color, now removed from use */
        --success-green: #10b981; 
    }
    
    * {
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 20px;
    }

    .container {
        width: 100%;
        max-width: 600px;
        text-align: center;
    }

    /* Page Header */
    .page-header {
        display: inline-block;
        border: 2px solid var(--text-dark);
        padding: 10px 30px;
        font-weight: 700;
        letter-spacing: 2px;
        font-size: 16px;
        border-radius: 50px;
        margin-bottom: 50px;
        text-transform: uppercase;
        color: var(--text-dark);
    }
    
    /* Contact Card Styling */
    .contact-card {
        background: var(--white);
        border-radius: 12px;
        padding: 40px 30px;
        margin-bottom: 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .contact-card h2 {
        font-size: 24px;
        color: var(--text-dark);
        margin-bottom: 25px;
        font-weight: 800;
    }
    
    .contact-item {
        margin-bottom: 30px; /* Increased margin for better separation */
    }

    .contact-item h3 {
        font-size: 16px;
        color: var(--text-gray);
        font-weight: 600;
        margin-bottom: 10px;
        text-transform: uppercase;
    }

    .contact-item p, .contact-item a { /* Apply styling to anchor tag inside contact-item */
        font-size: 20px;
        color: var(--text-dark);
        font-weight: 700;
        margin: 0;
        text-decoration: none; /* Remove underline by default */
        transition: color 0.3s ease;
    }
    
    .contact-item a:hover {
        color: var(--accent);
        text-decoration: underline;
    }

    /* --- CTA Buttons Styling --- */
    .send-email-btn, .social-link-btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 25px;
        color: var(--white);
        text-decoration: none;
        border-radius: 50px;
        font-weight: 700;
        transition: var(--transition);
        font-size: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Primary Email Button */
    .send-email-btn {
        background: var(--accent);
        margin-top: 30px; /* Space above the first button */
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    .send-email-btn:hover {
        background: #1d4ed8;
        transform: translateY(-3px);
    }

    .send-email-btn svg {
        fill: var(--white);
        width: 20px;
        height: 20px;
        margin-right: 10px;
    }
    
    /* New LinkedIn Button */
    .social-link-btn {
        background: var(--text-dark);
        margin-top: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .social-link-btn:hover {
        background: var(--linkedin-blue);
        transform: translateY(-3px);
    }
    
    .social-link-btn svg {
        fill: var(--white);
        width: 18px;
        height: 18px;
        margin-right: 8px;
    }

    /* Back to Home Link */
    .back-home {
        margin-top: 50px;
        color: var(--text-gray);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
        padding: 10px 0;
    }

    .back-home:hover {
        color: var(--accent);
    }

    @media (max-width: 600px) {
        .page-header {
            font-size: 14px;
            padding: 8px 20px;
        }
        .contact-card {
            padding: 30px 20px;
        }
        .send-email-btn, .social-link-btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="page-header">CONTACT ME</div>

    <div class="contact-card">
        <h2>I'm excited to hear from you!</h2>

        <div class="contact-item">

</body>
</html>
